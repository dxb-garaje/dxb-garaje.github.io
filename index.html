<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DXB Garaje</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="stylesheet" href="cargador.css">
</head><body>
<div id="app"></div>
<div id="candado"><div class="caja">
  <img src="logo.png" alt=""><b>DXB Garaje</b>
  <p>Acceso privado</p>
  <div id="paso-codigo">
    <input id="codigo" placeholder="Código de acceso" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="b-entrar" class="prim">Entrar</button>
  </div>
  <div id="paso-bio" style="display:none">
    <button id="b-bio" class="prim">Abrir con Face ID o huella</button>
    <button id="b-usar-codigo" class="enlace">Usar el código de acceso</button>
  </div>
  <div id="paso-activar" style="display:none">
    <p class="ayuda" style="color:var(--ink)">¿Proteger la app con Face ID o tu huella? Te la pedirá cada vez que la abras.</p>
    <button id="b-activar-bio" class="prim">Activar</button>
    <button id="b-no-bio" class="enlace">Ahora no</button>
  </div>
  <p id="candado-error"></p>
</div></div>
<script src="app.cifrada.js"></script>
<script src="cargador.js"></script>
</body></html>
